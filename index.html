<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inżynierka Flashcards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body { background: #f5f7fb; }
    .question-card {
      background: #ffffff;
      border-left: 4px solid #0d6efd;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.08);
      border-radius: 0.75rem;
    }
    .answer-card {
      background: #eef3ff;
      border-radius: 0.75rem;
    }
    .question-number {
      font-weight: 600;
      color: #0d6efd;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Inżynierka Flashcards</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="index.html">Wszystkie pytania</a>
        <a class="nav-link" href="losuj.html">Losuj pytania</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <header class="mb-4 text-center">
      <h1 class="fw-bold">Komplet pytań i odpowiedzi</h1>
      <p class="text-muted">Przewijaj, aby przejrzeć wszystkie flashcardy.</p>
    </header>
    <div id="questionsContainer" class="row g-4"></div>
  </main>

  <footer class="bg-dark text-white-50 py-3">
    <div class="container text-center small">
      © <span id="year"></span> Inżynierka Flashcards
    </div>
  </footer>

  <script>
    const questionsContainer = document.getElementById('questionsContainer');

    async function loadQuestions() {
      try {
        const response = await fetch('pytania_inzynierka.json');
        const data = await response.json();
        renderQuestions(data.questions || []);
      } catch (error) {
        questionsContainer.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger" role="alert">
              Nie udało się załadować pytań. Spróbuj odświeżyć stronę.
            </div>
          </div>`;
        console.error('Błąd ładowania pytań:', error);
      }
    }

    function renderQuestions(list) {
      questionsContainer.innerHTML = '';
      list.forEach((item, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'col-12';
        const numericId = parseInt(String(item.id || '').replace(/\D/g, ''), 10);
        const isSpecialized = Number.isFinite(numericId) && numericId >= 101 && numericId <= 130;
        wrapper.innerHTML = `
          <article class="p-3 p-md-4 bg-transparent rounded-3 border border-0">
            <div class="question-card p-3 p-md-4 mb-3">
              <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <span class="question-number">Pytanie ${index + 1}</span>
                <div class="d-flex flex-wrap gap-2">
                  <span class="badge bg-primary-subtle text-primary fw-semibold">#${item.id}</span>
                  ${isSpecialized ? '<span class="badge bg-warning text-dark fw-semibold">Specjalizacyjne</span>' : ''}
                </div>
              </div>
              <p class="mb-0 fs-5">${item.question}</p>
            </div>
            <div class="answer-card p-3 p-md-4">
              <h6 class="text-uppercase text-secondary fw-semibold mb-2">Odpowiedź</h6>
              <p class="mb-0">${item.answer}</p>
            </div>
            <hr class="mt-4" style="border-top: 2px solid #000;">
          </article>`;
        questionsContainer.appendChild(wrapper);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      loadQuestions();
    });
  </script>
</body>
</html>
